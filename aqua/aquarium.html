<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Living Glass Aquarium</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0a141c; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 14px; right: 14px; display: flex; gap: 8px; z-index: 10;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #hud button {
    appearance: none; border: 1px solid rgba(180, 220, 235, 0.18);
    background: rgba(8, 16, 22, 0.55); color: #cfe6ee;
    padding: 7px 13px; border-radius: 9px; font-size: 12px; letter-spacing: 0.02em;
    cursor: pointer; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  #hud button:hover { background: rgba(30, 52, 66, 0.65); border-color: rgba(180, 220, 235, 0.35); }
  #hud button:active { transform: translateY(1px); }
  #hint {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    color: rgba(200, 225, 235, 0.5); font-size: 11.5px; z-index: 10; pointer-events: none;
    font-family: ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.04em;
    animation: hintFade 9s ease forwards;
  }
  @keyframes hintFade { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
  #veil {
    position: fixed; inset: 0; background: #0a141c; z-index: 20; pointer-events: none;
    transition: opacity 1.2s ease; opacity: 1;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <button id="btnReset" type="button">Reset view</button>
  <button id="btnPause" type="button">Pause</button>
</div>
<div id="hint">drag to orbit &nbsp;&middot;&nbsp; scroll to zoom &nbsp;&middot;&nbsp; right-drag to pan</div>
<div id="veil"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================= utils ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rand = (a, b) => a + Math.random() * (b - a);
function hash3(x, y, z) { const s = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453; return s - Math.floor(s); }
function makeNoise2D(seed) {
  let s = seed >>> 0 || 1;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const perm = [...Array(256).keys()];
  for (let i = 255; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; const t = perm[i]; perm[i] = perm[j]; perm[j] = t; }
  const p = new Uint8Array(512);
  for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
  const fade = t => t * t * (3 - 2 * t);
  return function (x, y) {
    const X = Math.floor(x), Y = Math.floor(y);
    const xf = x - X, yf = y - Y;
    const h = (i, j) => p[(p[(X + i) & 255] + Y + j) & 255] / 255;
    const u = fade(xf), v = fade(yf);
    return lerp(lerp(h(0, 0), h(1, 0), u), lerp(h(0, 1), h(1, 1), u), v);
  };
}
const noise2 = makeNoise2D(1337);
function canvasTexture(size, draw, opts = {}) {
  const c = document.createElement('canvas');
  c.width = opts.w || size; c.height = opts.h || size;
  draw(c.getContext('2d'), c.width, c.height);
  const t = new THREE.CanvasTexture(c);
  if (opts.srgb !== false) t.colorSpace = THREE.SRGBColorSpace;
  if (opts.repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(opts.repeat[0], opts.repeat[1]); }
  t.anisotropy = 4;
  return t;
}
function softDotTexture() {
  return canvasTexture(64, (g, w, h) => {
    const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    gr.addColorStop(0, 'rgba(255,255,255,1)');
    gr.addColorStop(0.4, 'rgba(255,255,255,0.5)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  });
}
const UP_AXIS = new THREE.Vector3(0, 1, 0);
const X_AXIS = new THREE.Vector3(1, 0, 0);
const _v1 = new THREE.Vector3();
const _v2 = new THREE.Vector3();
const _v3 = new THREE.Vector3();
const _v4 = new THREE.Vector3();
const _q1 = new THREE.Quaternion();
const _q2 = new THREE.Quaternion();
const _m1 = new THREE.Matrix4();
function setSegment(mesh, a, b, r) {
  const d = _v1.subVectors(b, a);
  const len = Math.max(d.length(), 1e-5);
  mesh.position.copy(a).addScaledVector(d, 0.5);
  mesh.scale.set(r, len, r);
  mesh.quaternion.setFromUnitVectors(UP_AXIS, d.normalize());
}

/* ================= config ================= */
const TANK = { w: 8, d: 4, h: 5 };
const WATERLINE = 4.55;
const IX = 3.94, IZ = 1.94;
const FISH_BOUNDS = { x: 3.45, z: 1.5, y0: 0.8, y1: 4.32 };
const OBSTACLES = [];
const FISH = [];
const PLANTS = [];
const RIPPLE_MAX = 16;

/* ================= renderer / scene / camera ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const bgTexture = canvasTexture(512, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, '#1b3a48');
  gr.addColorStop(0.45, '#122a38');
  gr.addColorStop(1, '#0a1720');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  const rg = g.createRadialGradient(w * 0.5, h * 0.32, 10, w * 0.5, h * 0.32, w * 0.55);
  rg.addColorStop(0, 'rgba(70, 130, 155, 0.35)');
  rg.addColorStop(1, 'rgba(70, 130, 155, 0)');
  g.fillStyle = rg; g.fillRect(0, 0, w, h);
});
scene.background = bgTexture;

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 120);
const CAM_HOME = new THREE.Vector3(8.6, 6.0, 12.2);
const TARGET_HOME = new THREE.Vector3(0, 2.45, 0);
camera.position.copy(CAM_HOME);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 8.0;
controls.maxDistance = 30;
controls.minPolarAngle = 0.12;
controls.maxPolarAngle = 1.45;
controls.target.copy(TARGET_HOME);
controls.addEventListener('change', () => {
  controls.target.x = clamp(controls.target.x, -2.2, 2.2);
  controls.target.y = clamp(controls.target.y, 1.2, 3.8);
  controls.target.z = clamp(controls.target.z, -1.4, 1.4);
});

/* ================= lights ================= */
const hemi = new THREE.HemisphereLight(0x9fd4e0, 0x14202a, 0.55);
scene.add(hemi);
const keyLight = new THREE.DirectionalLight(0xfff1d8, 1.8);
keyLight.position.set(5, 9, 4);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -7; keyLight.shadow.camera.right = 7;
keyLight.shadow.camera.top = 7; keyLight.shadow.camera.bottom = -7;
keyLight.shadow.camera.near = 1; keyLight.shadow.camera.far = 26;
keyLight.shadow.bias = -0.0004;
keyLight.shadow.normalBias = 0.02;
scene.add(keyLight);
scene.add(keyLight.target);
keyLight.target.position.set(0, 1.2, 0);
const fillLight = new THREE.DirectionalLight(0x7fb8cc, 0.35);
fillLight.position.set(-6, 4, -5);
scene.add(fillLight);
const tankSpot = new THREE.SpotLight(0xe8f4ff, 2.6, 0, 0.62, 0.7, 0);
tankSpot.position.set(0, 5.6, 0.25);
tankSpot.target.position.set(0, 1.4, 0);
scene.add(tankSpot);
scene.add(tankSpot.target);

/* ================= interior render target (refraction) ================= */
const RT_SCALE = 0.75;
const interiorRT = new THREE.WebGLRenderTarget(
  Math.floor(window.innerWidth * RT_SCALE),
  Math.floor(window.innerHeight * RT_SCALE),
  { samples: 4, depthBuffer: true }
);
interiorRT.depthTexture = new THREE.DepthTexture(
  Math.floor(window.innerWidth * RT_SCALE),
  Math.floor(window.innerHeight * RT_SCALE)
);
interiorRT.depthTexture.type = THREE.UnsignedIntType;

/* ================= waves ================= */
const WAVES = [
  { dx: 1.0, dz: 0.35, amp: 0.032, len: 2.7, speed: 0.85, phase: 0.0 },
  { dx: -0.65, dz: 1.0, amp: 0.022, len: 1.8, speed: 1.2, phase: 1.7 },
  { dx: 0.8, dz: -0.55, amp: 0.014, len: 1.15, speed: 1.65, phase: 3.1 },
  { dx: -0.35, dz: -1.0, amp: 0.009, len: 0.72, speed: 2.2, phase: 4.4 },
];
function waterHeight(x, z, t) {
  let h = 0;
  for (const w of WAVES) {
    const k = (Math.PI * 2) / w.len;
    h += w.amp * Math.sin((w.dx * x + w.dz * z) * k + t * w.speed + w.phase);
  }
  const edge = smoothstep(3.55, 3.92, Math.abs(x)) + smoothstep(1.55, 1.92, Math.abs(z));
  return WATERLINE + h + 0.018 * edge;
}

/* ================= shared current field ================= */
const FILTER_POS = new THREE.Vector3(2.95, 0, -1.4);
const FILTER_OUTLET = new THREE.Vector3(2.95, 1.12, -1.4);
function currentAt(x, y, z, t, out) {
  out.set(
    Math.sin(t * 0.45 + z * 0.9 + y * 0.3) * 0.03,
    Math.sin(t * 0.3 + x * 0.5) * 0.008,
    Math.cos(t * 0.38 + x * 0.7 + y * 0.4) * 0.03
  );
  const dx = x - FILTER_OUTLET.x, dy = y - FILTER_OUTLET.y, dz = z - FILTER_OUTLET.z;
  const d2 = dx * dx + dy * dy + dz * dz;
  const up = Math.exp(-d2 * 0.55) * 0.22;
  out.x += dx * up * 0.4;
  out.y += up;
  out.z += dz * up * 0.4;
  return out;
}

/* ================= shared uniforms ================= */
const sharedTime = { value: 0 };
const uInvProj = { value: new THREE.Matrix4() };
const uInvView = { value: new THREE.Matrix4() };
const uResolution = { value: new THREE.Vector2(1, 1) };
const uLightDir = { value: new THREE.Vector3(0.35, 0.85, 0.3).normalize() };
const uWaterline = { value: WATERLINE };
const uWaveA = { value: WAVES.map(w => new THREE.Vector4(w.dx, w.dz, w.amp, w.len)) };
const uWaveB = { value: WAVES.map(w => new THREE.Vector4(w.speed, w.phase, 0, 0)) };
const rippleData = [];
for (let i = 0; i < RIPPLE_MAX; i++) rippleData.push({ x: 0, z: 0, t0: -100, amp: 0 });
const uRipples = { value: Array.from({ length: RIPPLE_MAX }, () => new THREE.Vector4(0, 0, -100, 0)) };
function spawnRipple(x, z, t) {
  for (const r of rippleData) {
    if (t - r.t0 < 0.12) {
      const dx = x - r.x, dz = z - r.z;
      if (dx * dx + dz * dz < 0.06) return;
    }
  }
  let slot = rippleData[0];
  for (const r of rippleData) if (r.t0 < slot.t0) slot = r;
  slot.x = x; slot.z = z; slot.t0 = t; slot.amp = rand(0.5, 0.9);
}

/* ================= shader chunks ================= */
const RECONSTRUCT_GLSL = `
  vec2 suv = gl_FragCoord.xy / uResolution;
  float depth = texture2D(tInteriorDepth, suv).x;
  vec4 ndc = vec4(suv * 2.0 - 1.0, depth * 2.0 - 1.0, 1.0);
  vec4 vpos = uInvProjection * ndc;
  vpos /= vpos.w;
  vec4 wpos4 = uInvView * vpos;
`;
const WATER_VERT = `
uniform float uTime;
uniform vec4 uWaveA[4];
uniform vec4 uWaveB[4];
varying vec3 vWorldPos;
varying vec3 vNormalW;
float waveH(vec2 p, float t) {
  float h = 0.0;
  for (int i = 0; i < 4; i++) {
    float k = 6.2831853 / uWaveA[i].w;
    h += uWaveA[i].z * sin(dot(uWaveA[i].xy, p) * k + t * uWaveB[i].x + uWaveB[i].y);
  }
  return h;
}
void main() {
  vec3 pos = position;
  float t = uTime;
  float h = waveH(pos.xz, t);
  float edge = smoothstep(3.55, 3.92, abs(pos.x)) + smoothstep(1.55, 1.92, abs(pos.z));
  h += 0.018 * edge;
  pos.y += h;
  float e = 0.08;
  float hx = waveH(pos.xz + vec2(e, 0.0), t) - waveH(pos.xz - vec2(e, 0.0), t);
  float hz = waveH(pos.xz + vec2(0.0, e), t) - waveH(pos.xz - vec2(0.0, e), t);
  vNormalW = normalize(vec3(-hx / (2.0 * e), 1.0, -hz / (2.0 * e)));
  vec4 wp = modelMatrix * vec4(pos, 1.0);
  vWorldPos = wp.xyz;
  gl_Position = projectionMatrix * viewMatrix * wp;
}
`;
const WATER_FRAG = `
uniform float uTime;
uniform sampler2D tInterior;
uniform sampler2D tInteriorDepth;
uniform mat4 uInvProjection;
uniform mat4 uInvView;
uniform vec2 uResolution;
uniform float uWaterline;
uniform vec4 uRipples[${RIPPLE_MAX}];
uniform vec3 uLightDir;
varying vec3 vWorldPos;
varying vec3 vNormalW;
vec3 waterEnv(vec3 d) {
  float up = clamp(d.y, 0.0, 1.0);
  vec3 sky = mix(vec3(0.05, 0.12, 0.16), vec3(0.55, 0.75, 0.85), pow(up, 1.5));
  vec3 col = mix(vec3(0.03, 0.05, 0.07), sky, up);
  float g = pow(max(dot(d, normalize(vec3(0.25, 0.9, 0.15))), 0.0), 24.0);
  col += vec3(1.0, 0.95, 0.85) * g * 1.2;
  return col;
}
void main() {
  ${RECONSTRUCT_GLSL}
  vec3 underPos = wpos4.xyz;
  vec3 N = normalize(vNormalW);
  if (!gl_FrontFacing) N = -N;
  for (int i = 0; i < ${RIPPLE_MAX}; i++) {
    vec4 r = uRipples[i];
    if (r.w > 0.001) {
      float age = uTime - r.z;
      if (age > 0.0 && age < 3.0) {
        vec2 dv = vWorldPos.xz - r.xy;
        float d = length(dv);
        float ring = sin(d * 16.0 - age * 6.5) * exp(-d * 1.1) * exp(-age * 1.6) * r.w;
        ring *= smoothstep(0.02, 0.12, age);
        N.xz += normalize(dv + vec2(0.0001)) * ring * 0.55;
      }
    }
  }
  N = normalize(N);
  vec3 V = normalize(cameraPosition - vWorldPos);
  float depthFrac = clamp((uWaterline - underPos.y) / 3.5, 0.0, 1.0);
  vec2 ruv = suv + N.xz * 0.035 * (0.35 + depthFrac);
  vec3 under = texture2D(tInterior, ruv).rgb;
  float path = clamp(uWaterline - underPos.y, 0.0, 4.0);
  under *= exp(-path * vec3(0.14, 0.062, 0.045));
  vec3 R = reflect(-V, N);
  vec3 env = waterEnv(R);
  float fres = 0.03 + 0.97 * pow(1.0 - max(dot(V, N), 0.0), 5.0);
  vec3 col = mix(under, env, clamp(fres * 1.15, 0.0, 1.0));
  float spec = pow(max(dot(R, uLightDir), 0.0), 140.0);
  col += vec3(1.0, 0.97, 0.9) * spec * 1.4;
  float ed = min(3.94 - abs(vWorldPos.x), 1.94 - abs(vWorldPos.z));
  col += vec3(0.45, 0.6, 0.65) * (1.0 - smoothstep(0.0, 0.10, ed)) * 0.35;
  gl_FragColor = vec4(col, 0.985);
}
`;
const GLASS_VERT = `
varying vec3 vWorldPos;
varying vec3 vNormalW;
void main() {
  vec4 wp = modelMatrix * vec4(position, 1.0);
  vWorldPos = wp.xyz;
  vNormalW = normalize(mat3(modelMatrix) * normal);
  gl_Position = projectionMatrix * viewMatrix * wp;
}
`;
const GLASS_FRAG = `
uniform float uTime;
uniform sampler2D tInterior;
uniform sampler2D tInteriorDepth;
uniform mat4 uInvProjection;
uniform mat4 uInvView;
uniform vec2 uResolution;
uniform float uWaterline;
uniform vec3 uLightDir;
varying vec3 vWorldPos;
varying vec3 vNormalW;
vec3 glassEnv(vec3 d) {
  float up = clamp(d.y * 0.5 + 0.5, 0.0, 1.0);
  vec3 col = mix(vec3(0.015, 0.025, 0.035), vec3(0.10, 0.16, 0.20), pow(up, 1.2));
  float g = pow(max(dot(d, normalize(vec3(0.25, 0.85, 0.2))), 0.0), 30.0);
  col += vec3(0.9, 0.95, 1.0) * g * 0.7;
  return col;
}
void main() {
  ${RECONSTRUCT_GLSL}
  vec3 N = normalize(vNormalW);
  if (!gl_FrontFacing) N = -N;
  vec3 V = normalize(cameraPosition - vWorldPos);
  float ndv = abs(dot(N, V));
  float fres = pow(1.0 - ndv, 4.0);
  vec2 ruv = suv + N.xz * 0.012 * sign(dot(N, V));
  vec3 under = texture2D(tInterior, ruv).rgb;
  float path = clamp(uWaterline - wpos4.xyz.y, 0.0, 4.0);
  under *= exp(-path * vec3(0.025, 0.012, 0.008));
  under *= vec3(0.995, 1.0, 1.005);
  vec3 refl = glassEnv(reflect(-V, N));
  vec3 col = under + refl * fres * 0.5;
  col += vec3(0.85, 0.92, 1.0) * pow(max(dot(reflect(-V, N), uLightDir), 0.0), 90.0) * 0.6;
  float alpha = 0.06 + fres * 0.24;
  gl_FragColor = vec4(col, alpha);
}
`;
const BUBBLE_VERT = `
varying vec3 vN;
varying vec3 vW;
void main() {
  #ifdef USE_INSTANCING
    mat4 im = instanceMatrix;
  #else
    mat4 im = mat4(1.0);
  #endif
  vec4 wp = modelMatrix * im * vec4(position, 1.0);
  vW = wp.xyz;
  vN = normalize(mat3(modelMatrix) * mat3(im) * normal);
  gl_Position = projectionMatrix * viewMatrix * wp;
}
`;
const BUBBLE_FRAG = `
uniform vec3 uLightDir;
varying vec3 vN;
varying vec3 vW;
void main() {
  vec3 N = normalize(vN);
  vec3 V = normalize(cameraPosition - vW);
  float ndv = abs(dot(N, V));
  float fres = pow(1.0 - ndv, 2.0);
  vec3 col = vec3(0.85, 0.95, 1.0) * (0.08 + fres * 0.55);
  vec3 R = reflect(-V, N);
  float spec = pow(max(dot(R, uLightDir), 0.0), 90.0);
  col += vec3(1.0) * spec * 1.6;
  float alpha = 0.16 + fres * 0.45 + spec * 0.4;
  gl_FragColor = vec4(col, alpha);
}
`;

/* ================= caustics material patcher ================= */
const CAUSTIC_GLSL = `
float causticFunc(vec2 uv, float t) {
  vec2 p = mod(uv * 6.28318, 6.28318) - 250.0;
  vec2 i = p;
  float c = 1.0;
  float inten = 0.005;
  for (int n = 0; n < 3; n++) {
    float tt = t * (1.0 - (3.5 / float(n + 1)));
    i = p + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x));
    c += 1.0 / length(vec2(p.x / (sin(i.x + tt) / inten), p.y / (cos(i.y + tt) / inten)));
  }
  c /= 3.0;
  c = 1.17 - pow(c, 1.4);
  return pow(abs(c), 7.0);
}
`;
function applyCaustics(mat, strength) {
  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uTime = sharedTime;
    shader.uniforms.uCausticStrength = { value: strength };
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWorldPosC;')
      .replace('#include <project_vertex>', `#include <project_vertex>
#ifdef USE_INSTANCING
        vWorldPosC = (modelMatrix * instanceMatrix * vec4(transformed, 1.0)).xyz;
#else
        vWorldPosC = (modelMatrix * vec4(transformed, 1.0)).xyz;
#endif`);
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>
varying vec3 vWorldPosC;
uniform float uTime;
uniform float uCausticStrength;
${CAUSTIC_GLSL}`)
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
{
  vec2 cp = vWorldPosC.xz * 1.15;
  float ca = causticFunc(cp + vec2(uTime * 0.018, uTime * 0.011), uTime * 0.4);
  totalEmissiveRadiance += vec3(0.65, 0.85, 0.95) * ca * uCausticStrength;
}`);
  };
  mat.customProgramCacheKey = () => 'caustic_' + strength;
}

/* ================= groups ================= */
const interiorGroup = new THREE.Group();
const exteriorGroup = new THREE.Group();
const opticsGroup = new THREE.Group();
scene.add(interiorGroup);
scene.add(exteriorGroup);
scene.add(opticsGroup);

/* ================= Stage 1: aquarium assembly ================= */
const backdropTex = canvasTexture(512, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, '#274b5c');
  gr.addColorStop(0.5, '#16303e');
  gr.addColorStop(1, '#0b1a24');

  const wallL = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.72, 0.34), stoneMat);

  const wallR = wallL.clone();
  wallR.position.set(0.36, 0.36, -0.22);
  const wallB = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.6, 0.3), stoneMat);
  wallB.position.set(0, 0.3, -0.55);

  const merlons = [

    castleGroup.add(b);
  }

  const winShape = new THREE.Shape();
  winShape.moveTo(-0.05, 0);
  winShape.lineTo(-0.05, 0.07);
  winShape.absarc(0, 0.07, 0.05, Math.PI, 0, true);
  winShape.lineTo(0.05, 0);

  const winGeo = new THREE.ShapeGeometry(winShape);
  const winFrameShape = new THREE.Shape();

  winFrameShape.lineTo(-0.09, 0.07);
  winFrameShape.absarc(0, 0.07, 0.09, Math.PI, 0, true);
  winFrameShape.lineTo(0.09, -0.02);

  winFrameShape.holes.push(winShape);
  const winFrameGeo = new THREE.ExtrudeGeometry(winFrameShape, { depth: 0.03, bevelEnabled: true, bevelSize: 0.004, bevelThickness: 0.004, bevelSegments: 2 });
  const winDefs = [

  // Individually shaped masonry shares one instanced draw call.

  const addStone = (x, y, z, w, h, d, yaw = 0, roll = 0) => {
    masonry.push({ x, y, z, w, h, d, yaw, roll });
  };
  for (const td of towerDefs) {
    const rows = Math.floor(td.h / 0.105);
    const count = 18;
    for (let row = 0; row < rows; row++) {
      const y = (row + 0.5) * td.h / rows;
      const radius = td.r * (1.08 - 0.08 * y / td.h);
      for (let j = 0; j < count; j++) {
        const angle = (j + (row % 2) * 0.5) * Math.PI * 2 / count;
        // Leave the framed arrow windows unobstructed.
        if (winDefs.some(wd => towerDefs[wd.tower] === td &&
          y > wd.y - 0.025 && y < wd.y + 0.16 &&
          Math.abs(Math.atan2(Math.sin(angle - wd.rotY), Math.cos(angle - wd.rotY))) < 0.32)) continue;
        addStone(td.x + Math.sin(angle) * radius, y, td.z + Math.cos(angle) * radius,
          radius * Math.PI * 2 / count * 0.94, td.h / rows * 0.92, 0.035, angle);
      }
    }
    for (const [y, radius, thickness] of [[0.065, td.r * 1.16, 0.1],
        [td.h - 0.1, td.r * 1.09, 0.055]]) {
      const ringGeo = new THREE.CylinderGeometry(radius, radius * 1.025, thickness, 32);

      ring.receiveShadow = true;

    }
    const top = new THREE.Mesh(new THREE.CylinderGeometry(td.r * 0.76, td.r * 0.76, 0.015, 32), darkInteriorMat);
    top.position.set(td.x, td.h + 0.058, td.z);
    castleGroup.add(top);
    // Corbels support the projecting parapets.
    for (let j = 0; j < 10; j++) {
      const angle = j * Math.PI * 2 / 10;
      addStone(td.x + Math.sin(angle) * td.r, td.h - 0.15,
        td.z + Math.cos(angle) * td.r, 0.055, 0.12, 0.09, angle);

  // Raised facade blocks keep the arched entrance open.
  for (let row = 0; row < 10; row++) {
    const y = 0.055 + row * 0.099;
    for (let j = 0; j < 7; j++) {
      const x = -0.48 + j * 0.16 + (row % 2) * 0.04;
      if (x > 0.52 || (Math.abs(x) < 0.26 && y < 0.56)) continue;
      addStone(x, y, 0.267, 0.145, 0.089, 0.036);
    }
  }
  // Radial voussoirs and a prominent keystone frame the gate.
  for (let j = 0; j < 11; j++) {
    const angle = (j + 0.5) * Math.PI / 11;
    addStone(Math.cos(angle) * 0.21, 0.3 + Math.sin(angle) * 0.21, 0.285,
      0.058, j === 5 ? 0.105 : 0.08, 0.075, 0, angle - Math.PI / 2);
  }
  for (const side of [-1, 1]) {
    for (let j = 0; j < 3; j++) addStone(side * 0.21, 0.05 + j * 0.1, 0.285, 0.075, 0.094, 0.075);
    // Stepped buttresses and carved coping on the gatehouse.
    addStone(side * 0.48, 0.3, 0.29, 0.12, 0.6, 0.13);
    addStone(side * 0.48, 0.63, 0.28, 0.15, 0.06, 0.16);
  }
  addStone(0, 1.01, 0.12, 1.16, 0.065, 0.4);
  for (let j = 0; j < 6; j++) addStone(-0.49 + j * 0.196, 1.1, 0.12, 0.115, 0.12, 0.3);
  for (let j = 0; j < 3; j++) addStone(0, 0.025 - j * 0.008, 0.38 + j * 0.12,
    0.38 + j * 0.055, 0.045, 0.14);
  const blocks = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), detailMat, masonry.length);
  const transform = new THREE.Object3D();
  const tint = new THREE.Color();
  masonry.forEach((block, index) => {
    transform.position.set(block.x, block.y, block.z);
    transform.rotation.set(0, block.yaw, block.roll);
    transform.scale.set(block.w, block.h, block.d);
    transform.updateMatrix();
    blocks.setMatrixAt(index, transform.matrix);
    const variation = 0.8 + hash3(index, 17, 3) * 0.22;
    tint.setRGB(variation, variation * 0.97, variation * 0.9);
    if (block.y < 0.2) tint.lerp(new THREE.Color(0.48, 0.58, 0.37), 0.22);
    blocks.setColorAt(index, tint);
  });
  blocks.castShadow = true;
  blocks.receiveShadow = true;
  castleGroup.add(blocks);

  const chips = [
    [-0.3, 1.28, -0.1, 0.06], [0.28, 0.95, 0.08, 0.05], [0.05, 0.42, 0.12, 0.045],
  ];
  for (const ch of chips) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(ch[3], 8, 6), darkInteriorMat);
    m.position.set(ch[0], ch[1], ch[2]);
    m.scale.set(1, 0.5, 0.6);
    castleGroup.add(m);
  }
}

function deformLeafMesh(mesh, base, t, amp, speed, phase, currentGain) {
  const pos = mesh.geometry.attributes.position;
  const uv = mesh.geometry.attributes.uv;
  const arr = pos.array;
  for (let i = 0; i < pos.count; i++) {
    const v = uv.getY(i);
    const bend = Math.pow(v, 1.6) * amp * currentGain;
    arr[i * 3] = base[i * 3] + Math.sin(t * speed + phase + v * 1.8) * bend;
    arr[i * 3 + 2] = base[i * 3 + 2] + Math.cos(t * speed * 0.87 + phase * 1.3 + v * 1.5) * bend * 0.7;
  }
  pos.needsUpdate = true;
  mesh.geometry.computeVertexNormals();
}
function makeRibbonLeaf(o) {
  const su = o.widthSegs || 2, sv = o.heightSegs || 22;
  const geo = new THREE.PlaneGeometry(1, 1, su, sv);
  const p = geo.attributes.position;
  const colors = new Float32Array(p.count * (o.alpha ? 4 : 3));
  const col = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    const u = p.getX(i);
    const v = p.getY(i) + 0.5;
    const w = o.widthProfile(v);
    const twist = (o.twist || 0) * v;
    const ct = Math.cos(twist), st = Math.sin(twist);
    const x = u * w * ct;
    const z0 = u * w * st + (o.crease || 0) * (1 - Math.abs(u)) * w;
    const y = v * o.height - (o.droop || 0) * v * v * o.height * 0.35;
    const x2 = x + (o.arc || 0) * Math.pow(v, 1.8);
    p.setXYZ(i, x2, y, z0);
    o.color(u, v, col);
    if (o.alpha) {
      colors[i * 4] = col.r; colors[i * 4 + 1] = col.g; colors[i * 4 + 2] = col.b;
      colors[i * 4 + 3] = o.alpha(u, v);
    } else {
      colors[i * 3] = col.r; colors[i * 3 + 1] = col.g; colors[i * 3 + 2] = col.b;
    }
  }
  if (o.alpha) geo.setAttribute('color', new THREE.BufferAttribute(colors, 4));
  else geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({
    vertexColors: true, roughness: o.roughness || 0.55, metalness: 0.0,
    side: THREE.DoubleSide,
  });
  if (o.alpha) { mat.transparent = true; mat.depthWrite = false; }
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  const base = new Float32Array(p.array);
  return { mesh, base, amp: o.sway || 0.05, speed: o.swaySpeed || 1.0, phase: o.phase || 0, currentGain: o.currentGain || 1 };
}
function registerPlant(group, leaves) {
  group.userData.leaves = leaves;
  PLANTS.push(group);
  interiorGroup.add(group);
}
function updatePlants(t) {
  for (const pg of PLANTS) {
    const leaves = pg.userData.leaves;
    for (const lf of leaves) {
      const cx = lf.mesh.getWorldPosition(_v1);
      currentAt(cx.x, cx.y, cx.z, t, _v2);
      const gain = 1 + (_v2.length() * 22) * lf.currentGain;
      deformLeafMesh(lf.mesh, lf.base, t, lf.amp, lf.speed, lf.phase, gain);
    }
  }
}

function buildCabomba() {
  const g = new THREE.Group();
  const px = -1.35, pz = -1.42;
  g.position.set(px, heightQuery(px, pz) - 0.03, pz);
  const leaves = [];
  const stemMat = new THREE.MeshStandardMaterial({ color: 0x3a5a28, roughness: 0.7 });
  const leafMat = new THREE.MeshStandardMaterial({
    color: 0x7fbf5a, roughness: 0.5, transparent: true, opacity: 0.92,
    side: THREE.DoubleSide, depthWrite: false,
  });
  const nStems = 6;
  for (let s = 0; s < nStems; s++) {
    const a = (s / nStems) * Math.PI * 2 + rand(-0.4, 0.4);
    const lean = rand(0.05, 0.22);
    const h = rand(1.2, 1.85);
    const baseX = Math.cos(a) * 0.05, baseZ = Math.sin(a) * 0.05;
    const topX = baseX + Math.cos(a) * lean, topZ = baseZ + Math.sin(a) * lean;
    const stemGeo = new THREE.CylinderGeometry(0.008, 0.012, h, 5, 4);
    {
      const p = stemGeo.attributes.position;
      for (let i = 0; i < p.count; i++) {
        const v = p.getY(i) / h + 0.5;
        p.setX(i, p.getX(i) + Math.cos(a) * lean * v);
        p.setZ(i, p.getZ(i) + Math.sin(a) * lean * v);
      }
      stemGeo.computeVertexNormals();
    }
    const stem = new THREE.Mesh(stemGeo, stemMat);
    stem.position.set(baseX, h / 2, baseZ);
    g.add(stem);
    const leafGeo = new THREE.BufferGeometry();
    const verts = [], norms = [], uvs = [], idx = [];
    let vc = 0;
    const whorlCount = Math.floor((h - 0.15) / 0.12);
    for (let wI = 0; wI < whorlCount; wI++) {
      const v = 0.15 + wI * 0.12;
      const wx = baseX + Math.cos(a) * lean * (v / h);
      const wz = baseZ + Math.sin(a) * lean * (v / h);
      const leaflets = 5 + (wI % 2);
      for (let li = 0; li < leaflets; li++) {
        const la = (li / leaflets) * Math.PI * 2 + wI * 0.4;
        const ll = rand(0.09, 0.14);
        const lw = rand(0.02, 0.032);
        const dirx = Math.cos(la), dirz = Math.sin(la);
        const up = 0.35;
        const base = [wx, v, wz];
        const tip = [wx + dirx * ll, v + ll * up, wz + dirz * ll];
        const mid = [wx + dirx * ll * 0.5, v + ll * up * 0.75, wz + dirz * ll * 0.5];
        const px1 = -dirz * lw, pz1 = dirx * lw;
        verts.push(
          base[0] + px1, base[1], base[2] + pz1,
          base[0] - px1, base[1], base[2] - pz1,
          mid[0] + px1 * 0.4, mid[1], mid[2] + pz1 * 0.4,
          mid[0] - px1 * 0.4, mid[1], mid[2] - pz1 * 0.4,
          tip[0], tip[1], tip[2]
        );
        uvs.push(0, 0, 1, 0, 0.2, 0.5, 0.8, 0.5, 0.5, 1);
        for (let k = 0; k < 5; k++) norms.push(dirx, up, dirz);
        const b = vc;
        idx.push(b, b + 1, b + 2, b + 1, b + 3, b + 2, b + 2, b + 3, b + 4);
        vc += 5;
      }
    }
    leafGeo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));

function buildFishBody(spec) {
  const geo = new THREE.SphereGeometry(1, 56, 40);
  const pos = geo.attributes.position;
  const colors = new Float32Array(pos.count * 4);
  for (let i = 0; i < pos.count; i++) {
    const px = pos.getX(i), py = pos.getY(i), pz = pos.getZ(i);
    const t = (px + 1) * 0.5;
    const pr = spec.prof(t);
    const x = (t * 2 - 1) * spec.len * 0.5;
    pos.setXYZ(i, x, py * pr[0], pz * pr[1]);
    spec.color(px, py, pz, t, colors, i);
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 4));
  geo.computeVertexNormals();
  return geo;
}
function makeFin(shapeFn, su, sv) {
  const geo = new THREE.BufferGeometry();
  const verts = [], cols = [], uvs = [], idx = [];
  for (let iu = 0; iu <= su; iu++) {
    for (let iv = 0; iv <= sv; iv++) {
      const u = iu / su, v = (iv / sv) * 2 - 1;
      const r = shapeFn(u, v);
      verts.push(r.p[0], r.p[1], r.p[2]);
      cols.push(r.c[0], r.c[1], r.c[2], r.a);
      uvs.push(u, v);
    }
  }
  for (let iu = 0; iu < su; iu++) {
    for (let iv = 0; iv < sv; iv++) {
      const a = iu * (sv + 1) + iv, b = a + sv + 1;
      idx.push(a, b, a + 1, b, b + 1, a + 1);
    }
  }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 4));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  return geo;
}
function tailShapeFor(sp, o) {
  const x0 = sp.len * 0.5 - 0.02;
  return (u, v) => {
    const sc = 1 + (o.scallop || 0) * Math.sin(v * 9 + u * 3);
    const c = o.col(u, v);
    return {
      p: [-x0 - o.len * u, v * o.h * Math.pow(Math.max(u, 0.001), o.pow || 0.8) * sc, (o.curl || 0) * Math.sin(v * 5 + u * 4) * u],
      c: [c[0], c[1], c[2]], a: c[3],

}
function dorsalShapeFor(sp, o) {
  const sign = o.sign || 1;
  const baseY = (x) => {
    const t = clamp(x / sp.len + 0.5, 0, 1);
    return sp.prof(t)[0] * 0.88;
  };
  return (u, v) => {
    const vv = v * 0.5 + 0.5;
    const x = lerp(o.x0, o.x1, vv) - u * (o.sweep || 0);
    const prof = Math.pow(Math.sin(Math.PI * vv), o.profPow || 0.75);
    const c = o.col(u, v);
    return {
      p: [x, sign * (baseY(x) + u * o.h * prof), (o.curl || 0) * Math.sin(v * 6) * u],
      c: [c[0], c[1], c[2]], a: c[3],

  };

  };

    });

    pos: spec.start.clone(),

  }

}

  shellGroup.add(shell);
  shellGroup.position.copy(spec.shellPos);
  shellGroup.rotation.set(spec.shellTilt[0], 0, spec.shellTilt[1]);
  group.add(shellGroup);
  group.userData.tentacles = tentacles;
  interiorGroup.add(group);
  return group;
}
const snailARoute = [[1.15, 1.25], [2.0, 1.38], [2.75, 1.05], [2.5, 0.62], [1.55, 0.68], [1.0, 1.0]];
const snailAState = {
  pos: new THREE.Vector3(1.15, 0, 1.25),
  wp: 1,
  speed: 0.022,
  paused: 0,
  group: null,
};
snailAState.group = buildSnail({
  bodyCol: [0.62, 0.55, 0.45],
  foot: [0.19, 0.035, 0.085],
  shell: { whorls: 3.2, r0: 0.012, r1: 0.075, tube0: 0.008, tube1: 0.055, color: shellACol },
  shellPos: new THREE.Vector3(0, 0.075, -0.01),
  shellTilt: [-0.45, -1.9],
});
const snailBPath = [[1.15, 0.62], [1.72, 0.8], [2.12, 1.12], [1.6, 1.32], [1.18, 1.02]];
const snailBState = {
  x: 1.15, y: 0.62,
  wp: 1,
  speed: 0.014,
  group: null,
};
snailBState.group = buildSnail({
  bodyCol: [0.8, 0.76, 0.62],
  foot: [0.19, 0.085, 0.028],
  shell: { whorls: 3.5, r0: 0.012, r1: 0.08, tube0: 0.008, tube1: 0.06, color: shellBCol },
  shellPos: new THREE.Vector3(0, 0.075, -0.07),
  shellTilt: [0, -Math.PI / 2],
});
function updateSnailA(dt, t, crab) {
  const st = snailAState;
  if (st.paused > 0) {
    st.paused -= dt;
  } else {
    if (crab) {
      const dc = Math.hypot(st.pos.x - crab.pos.x, st.pos.z - crab.pos.z);
      if (dc < 0.45) {
        st.paused = 1.5;
      }
    }
    const wp = snailARoute[st.wp];
    const dx = wp[0] - st.pos.x, dz = wp[1] - st.pos.z;
    const d = Math.hypot(dx, dz);
    if (d < 0.12) {
      st.wp = (st.wp + 1) % snailARoute.length;
    } else {
      st.pos.x += (dx / d) * st.speed * dt;
      st.pos.z += (dz / d) * st.speed * dt;
    }
  }
  const y = heightQuery(st.pos.x, st.pos.z);
  st.group.position.set(st.pos.x, y, st.pos.z);
  const wp = snailARoute[st.wp];
  const dx = wp[0] - st.pos.x, dz = wp[1] - st.pos.z;
  const d = Math.max(Math.hypot(dx, dz), 1e-4);
  st.group.rotation.y = Math.atan2(-dz / d, dx / d);
  const tent = st.group.userData.tentacles;
  for (let i = 0; i < tent.length; i++) {
    tent[i].rotation.x = Math.sin(t * 1.8 + i * 2.1) * 0.18;
    tent[i].rotation.z = Math.cos(t * 1.5 + i * 1.3) * 0.15;
  }
  const pulse = 1 + Math.sin(t * 2.2) * 0.05;
  st.group.children[0].scale.set(0.19, 0.035 * pulse, 0.085);
}
function updateSnailB(dt, t) {
  const st = snailBState;
  const wp = snailBPath[st.wp];
  const dx = wp[0] - st.x, dy = wp[1] - st.y;
  const d = Math.hypot(dx, dy);
  if (d < 0.1) {
    st.wp = (st.wp + 1) % snailBPath.length;
  } else {
    st.x += (dx / d) * st.speed * dt;
    st.y += (dy / d) * st.speed * dt;
  }
  st.group.position.set(st.x, st.y, 1.925);
  st.group.rotation.z = Math.atan2(dy, dx);
  const tent = st.group.userData.tentacles;
  for (let i = 0; i < tent.length; i++) {
    tent[i].rotation.x = Math.sin(t * 1.4 + i * 2.4) * 0.2;
    tent[i].rotation.y = Math.cos(t * 1.1 + i * 1.7) * 0.18;
  }
}

/* ================= Stage 14: particles & light finish ================= */
const PARTICLE_COUNT = 70;
const particleGeo = new THREE.BufferGeometry();
const particlePos = new Float32Array(PARTICLE_COUNT * 3);
for (let i = 0; i < PARTICLE_COUNT; i++) {
  particlePos[i * 3] = rand(-3.7, 3.7);
  particlePos[i * 3 + 1] = rand(0.4, 4.3);
  particlePos[i * 3 + 2] = rand(-1.7, 1.7);
}
particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
const particles = new THREE.Points(particleGeo, new THREE.PointsMaterial({
  size: 0.035,
  map: softDotTexture(),
  transparent: true,
  opacity: 0.32,
  depthWrite: false,
  color: 0xbfe8ef,
  sizeAttenuation: true,
}));
particles.frustumCulled = false;
interiorGroup.add(particles);
function updateParticles(dt, t) {
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const x = particlePos[i * 3], y = particlePos[i * 3 + 1], z = particlePos[i * 3 + 2];
    currentAt(x, y, z, t, _v1);
    particlePos[i * 3] += (_v1.x + Math.sin(t * 0.5 + i) * 0.004) * dt;
    particlePos[i * 3 + 1] += (_v1.y + Math.cos(t * 0.4 + i * 1.7) * 0.003) * dt;
    particlePos[i * 3 + 2] += (_v1.z + Math.cos(t * 0.45 + i * 0.9) * 0.004) * dt;
    if (particlePos[i * 3] > 3.8) particlePos[i * 3] = -3.8;
    else if (particlePos[i * 3] < -3.8) particlePos[i * 3] = 3.8;
    if (particlePos[i * 3 + 1] > 4.35) particlePos[i * 3 + 1] = 0.45;
    else if (particlePos[i * 3 + 1] < 0.35) particlePos[i * 3 + 1] = 4.3;
    if (particlePos[i * 3 + 2] > 1.8) particlePos[i * 3 + 2] = -1.8;
    else if (particlePos[i * 3 + 2] < -1.8) particlePos[i * 3 + 2] = 1.8;
  }
  particleGeo.attributes.position.needsUpdate = true;
}

/* ================= Stage 15: UI, resize, pause ================= */
let paused = false;
const btnPause = document.getElementById('btnPause');
const btnReset = document.getElementById('btnReset');
btnPause.addEventListener('click', () => {
  paused = !paused;
  btnPause.textContent = paused ? 'Resume' : 'Pause';
});
btnReset.addEventListener('click', () => {
  camera.position.copy(CAM_HOME);
  controls.target.copy(TARGET_HOME);
});
const _v2d = new THREE.Vector2();
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  const rw = Math.max(2, Math.floor(w * RT_SCALE));
  const rh = Math.max(2, Math.floor(h * RT_SCALE));
  interiorRT.setSize(rw, rh);
  interiorRT.depthTexture.setSize(rw, rh);
}
window.addEventListener('resize', onResize);

/* ================= Stage 16: main loop ================= */
const clock = new THREE.Clock();
let simTime = 0;
updateCrab(0.001, 0, snailAState);
updateSnailA(0.001, 0, crabState);
updateSnailB(0.001, 0);
function animate() {
  requestAnimationFrame(animate);
  const rawDt = Math.min(clock.getDelta(), 0.05);
  const dt = paused ? 0 : rawDt;
  simTime += dt;
  sharedTime.value = simTime;

  camera.updateMatrixWorld();
  camera.matrixWorldInverse.copy(camera.matrixWorld).invert();
  camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
  uInvProj.value.copy(camera.projectionMatrixInverse);
  uInvView.value.copy(camera.matrixWorldInverse);
  renderer.getDrawingBufferSize(_v2d);
  uResolution.value.set(_v2d.x, _v2d.y);

  updateRippleUniforms();
  updateBubbles(dt, simTime);
  updatePlants(simTime);
  for (const f of FISH) {
    updateFishAI(f, dt);
    updateFishShape(f, simTime);
  }
  updateCrab(dt, simTime, snailAState);
  updateSnailA(dt, simTime, crabState);
  updateSnailB(dt, simTime);
  updateParticles(dt, simTime);

  controls.update();

  interiorGroup.visible = true;
  exteriorGroup.visible = false;
  opticsGroup.visible = false;
  renderer.setRenderTarget(interiorRT);
  renderer.render(scene, camera);

  // Keep the contents behind the transparent panes in the final pass.
  interiorGroup.visible = true;
  exteriorGroup.visible = true;
  opticsGroup.visible = true;
  renderer.setRenderTarget(null);
  renderer.render(scene, camera);
}
animate();
requestAnimationFrame(() => {
  document.getElementById('veil').style.opacity = '0';
});

/*__END__*/
</script>
